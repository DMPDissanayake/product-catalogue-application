name: product_catalogue_application
description: "A new Flutter project."
publish_to: 'none' 
version: 0.0.1+1

environment:
  sdk: ^3.10.3

flutter_icons:
  android: "launcher_icon"
  ios: true
  remove_alpha_ios: true
  image_path: "images/png/app_logo.png"

flutter_native_splash:
  color: "#ffffff"
  image: images/png/app_native_logo.png
  android: true
  android_gravity: center

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_screenutil: ^5.9.3
  flutter_svg: ^2.0.7
  flutter_bloc: ^9.1.1
  page_transition: ^2.2.2
  inner_shadow_flutter: ^0.0.1
  equatable: ^2.1.0
  shared_preferences: ^2.2.2
  get_it: ^9.2.1
  shimmer_animation: ^2.2.2+1
  shimmer: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.0





flutter:
  generate: true
  uses-material-design: true
  assets:
    - animations/
    - images/svg/
    - images/png/

  fonts:
    - family: AvenirArabic
      fonts:
        - asset: fonts/Linotype - Avenir Arabic Regular.otf
          weight: 400
        - asset: fonts/Linotype - Avenir Arabic Light.otf
          weight: 300
        - asset: fonts/Linotype - Avenir Arabic Heavy.otf
          weight: 700
